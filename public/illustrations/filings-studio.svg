<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Editor Window Header -->
  <rect x="20" y="20" width="560" height="42" rx="8" fill="#141414" stroke="#262626"/>
  <circle cx="40" cy="41" r="4.5" fill="#E5484D"/>
  <circle cx="56" cy="41" r="4.5" fill="#F2C14E"/>
  <circle cx="72" cy="41" r="4.5" fill="#2E9E5B"/>
  <text x="96" y="45" fill="#A3A3A3" font-family="system-ui" font-size="11" font-weight="bold">Supreme Court Filings Studio · 12-Section Writ Editor</text>
  <rect x="440" y="28" width="124" height="26" rx="4" fill="#262626"/>
  <text x="456" y="45" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">Standard Form #12</text>

  <!-- Left Column: 12-Section Checklist -->
  <g transform="translate(20, 74)">
    <rect width="180" height="266" rx="8" fill="#141414" stroke="#262626"/>
    <text x="16" y="24" fill="#737373" font-family="system-ui" font-size="9" font-weight="bold">SECTION CHECKLIST</text>
    
    <!-- 12 Sections Representation -->
    <g transform="translate(14, 36)">
      <rect width="152" height="22" rx="3" fill="#2E9E5B" fill-opacity="0.2" stroke="#2E9E5B"/>
      <text x="8" y="15" fill="#2E9E5B" font-family="system-ui" font-size="9" font-weight="bold">१. क्षेत्राधिकार (Jurisdiction) ✓</text>

      <rect y="26" width="152" height="22" rx="3" fill="#2E9E5B" fill-opacity="0.2" stroke="#2E9E5B"/>
      <text x="8" y="41" fill="#2E9E5B" font-family="system-ui" font-size="9" font-weight="bold">२. पक्ष-विपक्ष (Parties) ✓</text>

      <rect y="52" width="152" height="22" rx="3" fill="#FF9933" fill-opacity="0.2" stroke="#FF9933"/>
      <text x="8" y="67" fill="#FF9933" font-family="system-ui" font-size="9" font-weight="bold">३. संक्षिप्त तथ्य (Facts) ✍</text>

      <rect y="78" width="152" height="22" rx="3" fill="#1A1A1A"/>
      <text x="8" y="93" fill="#A3A3A3" font-family="system-ui" font-size="9">४. हक उल्लंघन (Rights Breached)</text>

      <rect y="104" width="152" height="22" rx="3" fill="#1A1A1A"/>
      <text x="8" y="119" fill="#A3A3A3" font-family="system-ui" font-size="9">५. कानूनी आधार (Legal Grounds)</text>

      <rect y="130" width="152" height="22" rx="3" fill="#1A1A1A"/>
      <text x="8" y="145" fill="#A3A3A3" font-family="system-ui" font-size="9">६. नजीर सन्दर्भ (Precedents)</text>

      <rect y="156" width="152" height="22" rx="3" fill="#1A1A1A"/>
      <text x="8" y="171" fill="#A3A3A3" font-family="system-ui" font-size="9">७. मागदावी (Plea / Relief)</text>

      <rect y="182" width="152" height="22" rx="3" fill="#1A1A1A"/>
      <text x="8" y="197" fill="#A3A3A3" font-family="system-ui" font-size="9">८. अन्तरिम आदेश (Interim Plea)</text>
    </g>
  </g>

  <!-- Right Column: Drafting Document Preview -->
  <g transform="translate(212, 74)">
    <rect width="368" height="266" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
    <rect x="20" y="20" width="328" height="226" fill="none" stroke="#E5E5E5" stroke-dasharray="2 2"/>

    <!-- Document Heading in Nepali -->
    <text x="184" y="44" fill="#0A0A0A" font-family="serif" font-size="13" font-weight="bold" text-anchor="middle">श्री सर्वोच्च अदालतमा चढाएको</text>
    <text x="184" y="60" fill="#0A0A0A" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">रिट निवेदन पत्र (Writ Petition)</text>
    <text x="184" y="74" fill="#5C5C5C" font-family="system-ui" font-size="8" text-anchor="middle">नेपालको संविधानको धारा १३३ (२) र (३) बमोजिम</text>

    <!-- Paragraph 1 -->
    <g transform="translate(30, 90)">
      <text x="0" y="12" fill="#0A0A0A" font-family="serif" font-size="10" font-weight="bold">१. क्षेत्राधिकार र तथ्य:</text>
      <rect x="0" y="18" width="308" height="5" rx="2" fill="#E5E5E5"/>
      <rect x="0" y="28" width="308" height="5" rx="2" fill="#E5E5E5"/>
      <rect x="0" y="38" width="240" height="5" rx="2" fill="#E5E5E5"/>
    </g>

    <!-- Paragraph 2 -->
    <g transform="translate(30, 146)">
      <text x="0" y="12" fill="#0A0A0A" font-family="serif" font-size="10" font-weight="bold">२. अन्तरिम आदेशको माग:</text>
      <rect x="0" y="18" width="308" height="5" rx="2" fill="#E5E5E5"/>
      <rect x="0" y="28" width="270" height="5" rx="2" fill="#E5E5E5"/>
    </g>

    <!-- Bottom Status in Document -->
    <rect x="30" y="210" width="130" height="22" rx="4" fill="#EBF7F0"/>
    <text x="40" y="225" fill="#2E9E5B" font-family="system-ui" font-size="9" font-weight="bold">✓ Rules Compliant Form</text>

    <rect x="236" y="210" width="102" height="22" rx="4" fill="#0A0A0A"/>
    <text x="248" y="225" fill="#FFFFFF" font-family="system-ui" font-size="9">Export .DOCX / .PDF</text>
  </g>
</svg>
