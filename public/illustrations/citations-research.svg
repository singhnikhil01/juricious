<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Left Side: Law Library Book Spines Visual -->
  <g transform="translate(30, 24)">
    <rect width="180" height="312" rx="10" fill="#141414" stroke="#262626"/>
    <text x="16" y="28" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">NEPAL KANOON PATRIKA</text>
    <text x="16" y="44" fill="#FFFFFF" font-family="serif" font-size="14" font-weight="bold">नेपाल कानून पत्रिका (NKP)</text>

    <!-- 4 Book Spines Graphics -->
    <g transform="translate(16, 60)">
      <!-- Book 1 -->
      <rect width="32" height="230" rx="4" fill="#8B263E" stroke="#5A1223"/>
      <rect x="4" y="10" width="24" height="6" fill="#F2C14E"/>
      <rect x="4" y="210" width="24" height="6" fill="#F2C14E"/>
      <text x="-120" y="20" fill="#FFFFFF" font-family="serif" font-size="9" font-weight="bold" transform="rotate(-90)">NKP २०८० · खण्ड १</text>

      <!-- Book 2 -->
      <rect x="38" width="32" height="230" rx="4" fill="#1C3F6E" stroke="#0F2440"/>
      <rect x="42" y="10" width="24" height="6" fill="#F2C14E"/>
      <rect x="42" y="210" width="24" height="6" fill="#F2C14E"/>
      <text x="-120" y="58" fill="#FFFFFF" font-family="serif" font-size="9" font-weight="bold" transform="rotate(-90)">NKP २०८० · खण्ड २</text>

      <!-- Book 3 Active Highlight -->
      <rect x="76" width="34" height="230" rx="4" fill="#1A4D2E" stroke="#FF9933" stroke-width="1.5"/>
      <rect x="80" y="10" width="26" height="6" fill="#FF9933"/>
      <rect x="80" y="210" width="26" height="6" fill="#FF9933"/>
      <text x="-120" y="97" fill="#FF9933" font-family="serif" font-size="9" font-weight="bold" transform="rotate(-90)">NKP २०८१ · निर्णय #10492</text>

      <!-- Book 4 -->
      <rect x="116" width="32" height="230" rx="4" fill="#2E2E2E" stroke="#1F1F1F"/>
      <rect x="120" y="10" width="24" height="6" fill="#737373"/>
      <rect x="120" y="210" width="24" height="6" fill="#737373"/>
      <text x="-120" y="136" fill="#A3A3A3" font-family="serif" font-size="9" transform="rotate(-90)">SUPREME COURT DIGEST</text>
    </g>
  </g>

  <!-- Right Side: Authentic Citation Result Card -->
  <g transform="translate(226, 24)">
    <rect width="344" height="312" rx="10" fill="#141414" stroke="#262626"/>
    
    <!-- Verified Citation Banner -->
    <rect x="16" y="16" width="160" height="22" rx="4" fill="#EBF7F0"/>
    <text x="24" y="31" fill="#2E9E5B" font-family="system-ui" font-size="10" font-weight="bold">✓ 100% CITED PRECEDENT</text>
    <text x="190" y="31" fill="#737373" font-family="system-ui" font-size="10">Zero Hallucinations</text>

    <!-- Case Title -->
    <text x="16" y="64" fill="#FF9933" font-family="system-ui" font-size="11" font-weight="bold">NKP २०८१ · अंक ४ · निर्णय नं. १०४९२</text>
    <text x="16" y="86" fill="#FFFFFF" font-family="serif" font-size="14" font-weight="bold">हरिनारायण श्रेष्ठ वि. आन्तरिक राजस्व विभाग</text>
    
    <!-- Bench Composition -->
    <rect x="16" y="98" width="312" height="42" rx="6" fill="#1A1A1A" stroke="#262626"/>
    <text x="26" y="114" fill="#A3A3A3" font-family="system-ui" font-size="9">इजलास (BENCH COMPOSITION):</text>
    <text x="26" y="130" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold">माननीय न्यायाधीश प्रकाशमान सिंह राउत र माननीय न्यायाधीश सुष्मालता माथेमा</text>

    <!-- Legal Principle / Ratio Decidendi -->
    <rect x="16" y="150" width="312" height="96" rx="6" fill="#1F1F1F" stroke="#333333"/>
    <text x="26" y="170" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">प्रतिपादित कानूनी सिद्धान्त (RATIO DECIDENDI):</text>
    <text x="26" y="190" fill="#E5E5E5" font-family="serif" font-size="10">"कर निर्धारण आदेशमा प्राकृतिक न्यायको सिद्धान्त (Natural Justice)</text>
    <text x="26" y="206" fill="#E5E5E5" font-family="serif" font-size="10">अनुरूप सफाइको उचित मौका नदिई गरिएको निर्णय बदरभागी हुन्छ।"</text>
    <text x="26" y="232" fill="#737373" font-family="system-ui" font-size="9">Cited in 18 High Court Commercial judgments · Binding Ratio</text>

    <!-- Bottom Actions -->
    <rect x="16" y="258" width="150" height="38" rx="6" fill="#FF9933"/>
    <text x="32" y="282" fill="#0A0A0A" font-family="system-ui" font-size="11" font-weight="bold">Copy Formatted Citation</text>

    <rect x="176" y="258" width="152" height="38" rx="6" fill="#262626"/>
    <text x="194" y="282" fill="#FFFFFF" font-family="system-ui" font-size="11">View Full Judgment</text>
  </g>
</svg>
