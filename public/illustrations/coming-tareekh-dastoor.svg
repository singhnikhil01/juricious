<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" fill="none">
  <rect width="400" height="180" rx="8" fill="#141414" stroke="#262626"/>
  
  <!-- Clock & Warning Icon -->
  <g transform="translate(24, 30)">
    <circle cx="36" cy="60" r="32" fill="#FFF8E6" stroke="#F2C14E" stroke-width="2"/>
    <text x="36" y="68" fill="#8A5800" font-family="serif" font-size="24" font-weight="bold" text-anchor="middle">⏱</text>
  </g>

  <!-- Content Details -->
  <g transform="translate(105, 26)">
    <rect width="110" height="20" rx="4" fill="#FFF8E6"/>
    <text x="55" y="34" fill="#8A5800" font-family="system-ui" font-size="9" font-weight="bold" text-anchor="middle">COURT FEES ACT 2049</text>
    
    <text x="0" y="58" fill="#FFFFFF" font-family="serif" font-size="14" font-weight="bold">तारेख दस्तुर सूचना (Statutory Prompt)</text>
    <text x="0" y="74" fill="#A3A3A3" font-family="system-ui" font-size="10">Proactive deposit warning before case abeyance.</text>

    <!-- Formula / Penalty rule card -->
    <rect y="84" width="270" height="52" rx="6" fill="#1F1F1F" stroke="#333333"/>
    <text x="12" y="104" fill="#F2C14E" font-family="monospace" font-size="10">Section 14: Overdue Deposit Penalty Alert</text>
    <text x="12" y="122" fill="#E5E5E5" font-family="system-ui" font-size="9">Auto-calculates daily penalty percentage per statutory slab.</text>
  </g>
</svg>
