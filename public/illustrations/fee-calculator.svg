<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Left Side: Statutory Court Fees Act Calculation -->
  <g transform="translate(30, 24)">
    <rect width="320" height="312" rx="10" fill="#141414" stroke="#262626"/>
    <text x="20" y="32" fill="#FF9933" font-family="system-ui" font-size="11" font-weight="bold">COURT FEES ACT 2049 · SCHEDULE 1</text>
    <text x="20" y="50" fill="#FFFFFF" font-family="serif" font-size="16" font-weight="bold">अदालत शुल्क गणना (Suit Valuation)</text>

    <!-- Claim Amount Slider/Input Graphic -->
    <rect x="20" y="68" width="280" height="42" rx="6" fill="#1F1F1F" stroke="#333333"/>
    <text x="32" y="86" fill="#737373" font-family="system-ui" font-size="9">DISPUTE VALUE (विगो रकम)</text>
    <text x="32" y="102" fill="#FF9933" font-family="monospace" font-size="13" font-weight="bold">NPR 5,00,000 (पाँच लाख)</text>

    <!-- Calculation Slabs -->
    <g transform="translate(20, 126)">
      <!-- Slab 1 -->
      <rect width="280" height="28" rx="4" fill="#1A1A1A"/>
      <text x="10" y="18" fill="#A3A3A3" font-family="system-ui" font-size="9">First NPR 25,000 @ 5%</text>
      <text x="220" y="18" fill="#FFFFFF" font-family="monospace" font-size="10">NPR 1,250</text>

      <!-- Slab 2 -->
      <rect y="34" width="280" height="28" rx="4" fill="#1A1A1A"/>
      <text x="10" y="52" fill="#A3A3A3" font-family="system-ui" font-size="9">Next NPR 25,000 @ 3.5%</text>
      <text x="232" y="52" fill="#FFFFFF" font-family="monospace" font-size="10">NPR 875</text>

      <!-- Slab 3 -->
      <rect y="68" width="280" height="28" rx="4" fill="#1A1A1A"/>
      <text x="10" y="86" fill="#A3A3A3" font-family="system-ui" font-size="9">Next NPR 50,000 @ 2%</text>
      <text x="220" y="86" fill="#FFFFFF" font-family="monospace" font-size="10">NPR 1,000</text>

      <!-- Slab 4 -->
      <rect y="102" width="280" height="28" rx="4" fill="#1A1A1A"/>
      <text x="10" y="120" fill="#A3A3A3" font-family="system-ui" font-size="9">Next NPR 400,000 @ 1.5%</text>
      <text x="220" y="120" fill="#FFFFFF" font-family="monospace" font-size="10">NPR 6,000</text>

      <!-- Total Fee Banner -->
      <rect y="136" width="280" height="36" rx="6" fill="#FF9933"/>
      <text x="12" y="158" fill="#0A0A0A" font-family="system-ui" font-size="11" font-weight="bold">TOTAL COURT DEPOSIT:</text>
      <text x="194" y="159" fill="#0A0A0A" font-family="monospace" font-size="14" font-weight="bold">NPR 9,125</text>
    </g>
  </g>

  <!-- Right Side: FonePay QR Voucher Mockup -->
  <g transform="translate(370, 24)">
    <rect width="200" height="312" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
    
    <!-- Voucher Top Notch & Brand -->
    <rect x="20" y="14" width="160" height="26" rx="4" fill="#E51937"/>
    <text x="100" y="31" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">FonePay Merchant</text>

    <text x="100" y="58" fill="#0A0A0A" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">SHARMA LAW CHAMBERS</text>
    <text x="100" y="72" fill="#5C5C5C" font-family="system-ui" font-size="9" text-anchor="middle">Kumari Bank A/C: 0140-XXXX</text>

    <!-- QR Pattern Visual -->
    <rect x="35" y="86" width="130" height="130" rx="8" fill="#F7F7F7" stroke="#0A0A0A" stroke-width="2"/>
    
    <!-- QR Corner Targets -->
    <rect x="47" y="98" width="30" height="30" fill="#0A0A0A"/>
    <rect x="53" y="104" width="18" height="18" fill="#FFFFFF"/>
    <rect x="57" y="108" width="10" height="10" fill="#0A0A0A"/>

    <rect x="123" y="98" width="30" height="30" fill="#0A0A0A"/>
    <rect x="129" y="104" width="18" height="18" fill="#FFFFFF"/>
    <rect x="133" y="108" width="10" height="10" fill="#0A0A0A"/>

    <rect x="47" y="174" width="30" height="30" fill="#0A0A0A"/>
    <rect x="53" y="180" width="18" height="18" fill="#FFFFFF"/>
    <rect x="57" y="184" width="10" height="10" fill="#0A0A0A"/>

    <!-- Center Icon -->
    <rect x="92" y="143" width="16" height="16" rx="3" fill="#E51937"/>
    <text x="100" y="155" fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">F</text>

    <!-- Voucher Details -->
    <text x="100" y="234" fill="#0A0A0A" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">NPR 9,125.00</text>
    <text x="100" y="248" fill="#5C5C5C" font-family="system-ui" font-size="8" text-anchor="middle">Ref: Suit #081-CP-0492 Court Fee</text>

    <line x1="20" y1="260" x2="180" y2="260" stroke="#CCCCCC" stroke-dasharray="4 2"/>
    <text x="100" y="278" fill="#2E9E5B" font-family="system-ui" font-size="9" font-weight="bold" text-anchor="middle">Instant Receipt Generated ✓</text>
    <text x="100" y="292" fill="#737373" font-family="monospace" font-size="8" text-anchor="middle">Auditable Chamber Voucher</text>
  </g>
