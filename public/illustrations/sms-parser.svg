<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Left: Raw SMS on Phone Screen -->
  <g transform="translate(30, 30)">
    <rect width="240" height="300" rx="16" fill="#141414" stroke="#333333" stroke-width="2"/>
    <rect x="80" y="10" width="80" height="6" rx="3" fill="#262626"/>
    
    <text x="20" y="42" fill="#A3A3A3" font-family="system-ui" font-size="10" font-weight="bold">MESSAGES · COURT ALERT</text>
    <text x="20" y="58" fill="#737373" font-family="monospace" font-size="9">From: KTMDC-TAREEKH (NTC)</text>

    <!-- SMS Bubble -->
    <rect x="16" y="74" width="208" height="130" rx="10" fill="#1F1F1F" stroke="#FF9933" stroke-width="1.5"/>
    <text x="26" y="96" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">काठमाडौँ जिल्ला अदालत</text>
    <text x="26" y="116" fill="#E5E5E5" font-family="monospace" font-size="10">Case: 081-CP-0492</text>
    <text x="26" y="134" fill="#E5E5E5" font-family="monospace" font-size="10">Tareekh: 2083-08-15</text>
    <text x="26" y="152" fill="#E5E5E5" font-family="monospace" font-size="10">Bench: 7 (Babar Mahal)</text>
    <text x="26" y="172" fill="#F2C14E" font-family="system-ui" font-size="9">Notice: Dastoor due at filing</text>
    <text x="26" y="192" fill="#737373" font-family="system-ui" font-size="8">Received: 08:30 AM · SMS</text>

    <!-- Laser Scanning Beam -->
    <line x1="16" y1="130" x2="224" y2="130" stroke="#FF9933" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="16" y="220" width="208" height="32" rx="6" fill="#FF9933"/>
    <text x="75" y="240" fill="#0A0A0A" font-family="system-ui" font-size="11" font-weight="bold">Auto Parsing...</text>
  </g>

  <!-- Middle Arrow -->
  <path d="M 290 180 L 320 180 M 310 170 L 320 180 L 310 190" stroke="#FF9933" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: Parsed Structured Card -->
  <g transform="translate(340, 30)">
    <rect width="230" height="300" rx="12" fill="#141414" stroke="#2E9E5B" stroke-width="1.5"/>
    <rect x="16" y="16" width="100" height="20" rx="10" fill="#EBF7F0"/>
    <circle cx="26" cy="26" r="3" fill="#2E9E5B"/>
    <text x="34" y="30" fill="#2E9E5B" font-family="system-ui" font-size="9" font-weight="bold">PARSED 100%</text>

    <!-- Field 1 -->
    <text x="16" y="60" fill="#737373" font-family="system-ui" font-size="9">COURT JURISDICTION</text>
    <rect x="16" y="66" width="198" height="30" rx="4" fill="#1F1F1F" stroke="#333333"/>
    <text x="26" y="85" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold">Kathmandu District Court</text>

    <!-- Field 2 -->
    <text x="16" y="112" fill="#737373" font-family="system-ui" font-size="9">CASE REGISTRATION</text>
    <rect x="16" y="118" width="198" height="30" rx="4" fill="#1F1F1F" stroke="#333333"/>
    <text x="26" y="137" fill="#FF9933" font-family="monospace" font-size="11" font-weight="bold">081-CP-0492 (Civil)</text>

    <!-- Field 3 -->
    <text x="16" y="164" fill="#737373" font-family="system-ui" font-size="9">NEXT TAREEKH DATE</text>
    <rect x="16" y="170" width="198" height="30" rx="4" fill="#1F1F1F" stroke="#333333"/>
    <text x="26" y="189" fill="#2E9E5B" font-family="serif" font-size="13" font-weight="bold">२०८३ मंसिर १५ (आइतबार)</text>

    <!-- Field 4 -->
    <text x="16" y="216" fill="#737373" font-family="system-ui" font-size="9">BENCH ASSIGNMENT</text>
    <rect x="16" y="222" width="198" height="30" rx="4" fill="#1F1F1F" stroke="#333333"/>
    <text x="26" y="241" fill="#FFFFFF" font-family="system-ui" font-size="10">Bench 7 · Judge Sharma</text>

    <rect x="16" y="266" width="198" height="24" rx="4" fill="#2E9E5B"/>
    <text x="64" y="282" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold">✓ Saved to Chambers</text>
  </g>
</svg>
