<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Certificate Container -->
  <g transform="translate(40, 24)">
    <rect width="520" height="312" rx="10" fill="#141414" stroke="#333333" stroke-width="1.5"/>
    <rect x="10" y="10" width="500" height="292" rx="8" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="6 3"/>

    <!-- Seal and Header -->
    <circle cx="260" cy="50" r="24" fill="#1A1A1A" stroke="#FF9933" stroke-width="2"/>
    <text x="260" y="55" fill="#FF9933" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle">⚖</text>
    <text x="260" y="92" fill="#FFFFFF" font-family="serif" font-size="15" font-weight="bold" text-anchor="middle">DIGITAL CLIENT ENGAGEMENT &amp; REPRESENTATION CONSENT</text>
    <text x="260" y="108" fill="#A3A3A3" font-family="system-ui" font-size="10" text-anchor="middle">नेपाल बार काउन्सिल आचारसंहिता अनुसार कानूूनी वारेसनामा सहमति</text>

    <!-- Client and Case Info Grid -->
    <g transform="translate(30, 124)">
      <!-- Left Box: Client Identity -->
      <rect width="210" height="96" rx="6" fill="#1A1A1A" stroke="#2A2A2A"/>
      <text x="14" y="24" fill="#737373" font-family="system-ui" font-size="9" font-weight="bold">CLIENT VERIFICATION</text>
      <text x="14" y="44" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="bold">Sunil Kumar Shrestha</text>
      <text x="14" y="60" fill="#A3A3A3" font-family="monospace" font-size="10">NID: 738-921-0492 (Verified ✓)</text>
      <text x="14" y="76" fill="#A3A3A3" font-family="system-ui" font-size="9">Lalitpur Metropolitan City - 4</text>

      <!-- Right Box: Advocate Authority -->
      <g transform="translate(250, 0)">
        <rect width="210" height="96" rx="6" fill="#1A1A1A" stroke="#2A2A2A"/>
        <text x="14" y="24" fill="#737373" font-family="system-ui" font-size="9" font-weight="bold">AUTHORIZED ADVOCATE</text>
        <text x="14" y="44" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="bold">Adv. Rameshwar P. Sharma</text>
        <text x="14" y="60" fill="#FF9933" font-family="monospace" font-size="10">Bar Council Lic #3892</text>
        <text x="14" y="76" fill="#A3A3A3" font-family="system-ui" font-size="9">Supreme &amp; High Court Chambers</text>
