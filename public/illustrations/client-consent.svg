      <rect width="210" height="54" rx="6" fill="#1A1A1A" stroke="#262626"/>
      <circle cx="34" cy="27" r="16" fill="#262626" stroke="#2E9E5B"/>
      <text x="34" y="32" fill="#2E9E5B" font-size="14" text-anchor="middle">✓</text>
      <text x="60" y="24" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold">Client Digital Consent</text>
      <text x="60" y="38" fill="#737373" font-family="monospace" font-size="8">OTP Verified · 2083-08-01 10:14 AM</text>

      <!-- Advocate Seal -->
      <g transform="translate(250, 0)">
        <rect width="210" height="54" rx="6" fill="#1A1A1A" stroke="#262626"/>
        <circle cx="34" cy="27" r="16" fill="#262626" stroke="#FF9933"/>
        <text x="34" y="31" fill="#FF9933" font-size="10" font-weight="bold" text-anchor="middle">SEAL</text>
