<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="400" height="220" fill="#F9F9F9"/>
  <!-- Court fee reminder notification card -->
  <rect x="30" y="45" width="180" height="130" rx="8" fill="#0A0A0A"/>
  <!-- Notification header -->
  <rect x="30" y="45" width="180" height="36" rx="8" fill="#1A1A1A"/>
  <rect x="30" y="67" width="180" height="14" fill="#1A1A1A"/>
  <circle cx="52" cy="63" r="10" fill="#FF9933"/>
  <text x="52" y="67" text-anchor="middle" fill="#0A0A0A" font-size="9" font-weight="bold">J</text>
  <text x="100" y="58" fill="white" font-size="8" font-weight="bold">Juricious · 07:00 AM</text>
  <text x="100" y="70" fill="#A3A3A3" font-size="7">Dastoor Due · Today</text>
  <!-- Alert content -->
  <rect x="44" y="92" width="152" height="40" rx="4" fill="#1A1A1A"/>
  <text x="120" y="108" text-anchor="middle" fill="#F2C14E" font-size="8" font-weight="bold">⚠ Court Fee Reminder</text>
  <text x="120" y="122" text-anchor="middle" fill="#A3A3A3" font-size="7">Case 081-CP-0492 · Rs. 2,000</text>
  <!-- Amount badge -->
  <rect x="44" y="142" width="70" height="22" rx="4" fill="#FF9933"/>
  <text x="79" y="156" text-anchor="middle" fill="#0A0A0A" font-size="9" font-weight="bold">Pay Now</text>
  <rect x="122" y="142" width="74" height="22" rx="4" fill="#262626"/>
  <text x="159" y="156" text-anchor="middle" fill="#A3A3A3" font-size="9">Snooze 1hr</text>

  <!-- Fee schedule table -->
  <rect x="230" y="30" width="150" height="160" rx="6" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <rect x="230" y="30" width="150" height="26" rx="6" fill="#0A0A0A"/>
  <rect x="230" y="44" width="150" height="12" fill="#0A0A0A"/>
  <text x="305" y="47" text-anchor="middle" fill="#FF9933" font-size="8" font-weight="bold">Court Fees Act 2049</text>
  <rect x="244" y="66" width="122" height="1" fill="#E5E5E5"/>
  <text x="250" y="80" fill="#5C5C5C" font-size="7">Suit Value</text>
  <text x="355" y="80" text-anchor="end" fill="#5C5C5C" font-size="7">Fee</text>
  <rect x="244" y="84" width="122" height="1" fill="#E5E5E5"/>
  <text x="250" y="96" fill="#0A0A0A" font-size="7">Up to Rs. 1,000</text>
  <text x="355" y="96" text-anchor="end" fill="#0A0A0A" font-size="7">Rs. 20</text>
  <text x="250" y="110" fill="#0A0A0A" font-size="7">Rs. 1,001–5,000</text>
  <text x="355" y="110" text-anchor="end" fill="#0A0A0A" font-size="7">2%</text>
  <text x="250" y="124" fill="#0A0A0A" font-size="7">Rs. 5,001–25,000</text>
  <text x="355" y="124" text-anchor="end" fill="#FF9933" font-size="7" font-weight="bold">Rs. 500</text>
  <rect x="244" y="130" width="122" height="1" fill="#E5E5E5"/>
  <text x="250" y="144" fill="#0A0A0A" font-size="7">Over Rs. 1,00,000</text>
  <text x="355" y="144" text-anchor="end" fill="#0A0A0A" font-size="7">Rs. 2,000+</text>
  <rect x="244" y="168" width="122" height="16" rx="4" fill="#EBF7F0"/>
  <text x="305" y="179" text-anchor="middle" fill="#2E9E5B" font-size="8" font-weight="bold">Auto-calculated</text>
  <!-- dashed coming soon -->
  <rect x="226" y="26" width="158" height="168" rx="8" fill="none" stroke="#F2C14E" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
