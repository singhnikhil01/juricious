<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif">
  <rect width="400" height="220" fill="#F9F9F9"/>
  <!-- Bar Council card -->
  <rect x="30" y="30" width="200" height="130" rx="8" fill="#0A0A0A"/>
  <rect x="30" y="30" width="200" height="45" rx="8" fill="#1A1A1A"/>
  <rect x="30" y="61" width="200" height="14" fill="#1A1A1A"/>
  <!-- Badge circle -->
  <circle cx="65" cy="53" r="16" fill="#FF9933" opacity="0.9"/>
  <text x="65" y="57" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="bold">J</text>
  <text x="100" y="48" fill="white" font-size="8" font-weight="bold">Bar Council</text>
  <text x="100" y="60" fill="#A3A3A3" font-size="7">Nepal Bar Council Act 2050</text>
  <!-- Status rows -->
  <rect x="46" y="92" width="12" height="12" rx="2" fill="#2E9E5B"/>
  <rect x="64" y="94" width="80" height="8" rx="2" fill="#262626"/>
  <rect x="150" y="94" width="50" height="8" rx="2" fill="#2E9E5B" opacity="0.4"/>
  <rect x="46" y="112" width="12" height="12" rx="2" fill="#F2C14E"/>
  <rect x="64" y="114" width="100" height="8" rx="2" fill="#262626"/>
  <rect x="170" y="114" width="40" height="8" rx="2" fill="#F2C14E" opacity="0.4"/>
  <rect x="46" y="132" width="12" height="12" rx="2" fill="#2E9E5B"/>
  <rect x="64" y="134" width="70" height="8" rx="2" fill="#262626"/>
  <text x="140" y="142" fill="#2E9E5B" font-size="7">Verified</text>
  <!-- Verification panel -->
  <rect x="250" y="45" width="130" height="120" rx="6" fill="white" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="315" y="68" text-anchor="middle" fill="#0A0A0A" font-size="8" font-weight="bold">Licence Status</text>
  <rect x="264" y="76" width="102" height="1" fill="#E5E5E5"/>
  <circle cx="290" cy="102" r="20" fill="#EBF7F0" stroke="#2E9E5B" stroke-width="2"/>
  <text x="290" y="106" text-anchor="middle" fill="#2E9E5B" font-size="14" font-weight="bold">✓</text>
  <text x="315" y="130" text-anchor="middle" fill="#2E9E5B" font-size="8" font-weight="bold">Active</text>
  <rect x="264" y="140" width="102" height="14" rx="4" fill="#0A0A0A"/>
  <text x="315" y="150" text-anchor="middle" fill="#FF9933" font-size="8" font-weight="bold">Renew 2082-04-01</text>
  <!-- Dashed coming soon -->
  <rect x="246" y="41" width="138" height="128" rx="8" fill="none" stroke="#F2C14E" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
</svg>
