<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <rect width="600" height="360" rx="12" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  
  <!-- Left Side: Official Vakalatnama Sheet Mockup -->
  <g transform="translate(30, 20)">
    <rect width="260" height="320" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
    <rect x="10" y="10" width="240" height="300" rx="4" fill="none" stroke="#999999" stroke-width="1.5"/>

    <!-- Document Header -->
    <text x="130" y="34" fill="#0A0A0A" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">वकलतनामा (VAKALATNAMA)</text>
    <text x="130" y="48" fill="#5C5C5C" font-family="system-ui" font-size="9" text-anchor="middle">श्री सर्वोच्च अदालत / पाटन उच्च अदालतमा पेश गरेको</text>
    <line x1="24" y1="56" x2="236" y2="56" stroke="#0A0A0A" stroke-width="1"/>

    <!-- Formal Legal Body lines representation -->
    <text x="24" y="74" fill="#0A0A0A" font-family="serif" font-size="9" font-weight="bold">मुद्दा: निषेधाज्ञा तथा परमादेश (Writ 081-WO-0312)</text>
    <rect x="24" y="82" width="212" height="6" rx="2" fill="#E5E5E5"/>
    <rect x="24" y="94" width="212" height="6" rx="2" fill="#E5E5E5"/>
    <rect x="24" y="106" width="160" height="6" rx="2" fill="#E5E5E5"/>
    
    <text x="24" y="130" fill="#0A0A0A" font-family="system-ui" font-size="8" font-weight="bold">नियुक्त अधिवक्ता: रमेशवर प्रसाद शर्मा (प्र.नं. ३८९२)</text>
    <rect x="24" y="138" width="212" height="6" rx="2" fill="#E5E5E5"/>
    <rect x="24" y="150" width="180" height="6" rx="2" fill="#E5E5E5"/>

    <!-- Red Seal and Stamp -->
    <g transform="translate(30, 180)">
      <circle cx="36" cy="36" r="30" fill="#FFF5F5" stroke="#E51937" stroke-width="2" stroke-dasharray="3 1"/>
      <text x="36" y="32" fill="#E51937" font-family="serif" font-size="8" font-weight="bold" text-anchor="middle">सर्वोच्च बार</text>
      <text x="36" y="44" fill="#E51937" font-family="monospace" font-size="7" text-anchor="middle">VERIFIED</text>
      <text x="36" y="54" fill="#E51937" font-family="monospace" font-size="7" text-anchor="middle">2083-08</text>
    </g>

    <!-- Signatures and Thumbprint -->
    <g transform="translate(130, 180)">
      <rect x="10" y="10" width="50" height="50" rx="4" fill="#F5F5F5" stroke="#CCCCCC"/>
      <circle cx="35" cy="35" r="14" fill="#1A1A1A"/>
      <text x="35" y="38" fill="#FFFFFF" font-size="7" text-anchor="middle">THUMB</text>
      <text x="35" y="72" fill="#5C5C5C" font-family="system-ui" font-size="8" text-anchor="middle">पक्षको औँठाछाप</text>
    </g>

    <line x1="24" y1="270" x2="236" y2="270" stroke="#CCCCCC"/>
    <text x="130" y="288" fill="#2E9E5B" font-family="system-ui" font-size="9" font-weight="bold" text-anchor="middle">Instant Print &amp; Sign Ready ✓</text>
  </g>

  <!-- Right Side: Statutory Limitation Countdown Meter -->
  <g transform="translate(316, 20)">
    <rect width="254" height="320" rx="8" fill="#141414" stroke="#262626"/>
    
    <text x="16" y="30" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">MULUKI CIVIL CODE 2074</text>
    <text x="16" y="48" fill="#FFFFFF" font-family="serif" font-size="15" font-weight="bold">हदम्याद गणना (Limitation Tracker)</text>
    <text x="16" y="64" fill="#A3A3A3" font-family="system-ui" font-size="9">Statutory filing deadline with judicial holiday freeze</text>

    <!-- Meter 1: 35 Days Appeal Deadline -->
    <g transform="translate(16, 80)">
      <rect width="222" height="66" rx="6" fill="#1A1A1A" stroke="#FF9933"/>
      <text x="12" y="20" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">३५ दिने पुनरावेदन म्याद (High Court Appeal)</text>
      <text x="12" y="36" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">१२ दिन बाँकी (12 Days Left)</text>
      
      <!-- Progress Bar -->
      <rect x="12" y="46" width="198" height="8" rx="4" fill="#262626"/>
      <rect x="12" y="46" width="130" height="8" rx="4" fill="#FF9933"/>
    </g>

    <!-- Meter 2: 21 Days Revision Deadline -->
    <g transform="translate(16, 156)">
      <rect width="222" height="66" rx="6" fill="#1A1A1A" stroke="#262626"/>
      <text x="12" y="20" fill="#A3A3A3" font-family="system-ui" font-size="10" font-weight="bold">२१ दिने पुनरावलोकन (Order Revision)</text>
      <text x="12" y="36" fill="#2E9E5B" font-family="monospace" font-size="16" font-weight="bold">१९ दिन बाँकी (Safe)</text>
      
      <rect x="12" y="46" width="198" height="8" rx="4" fill="#262626"/>
      <rect x="12" y="46" width="40" height="8" rx="4" fill="#2E9E5B"/>
    </g>

    <!-- Holiday Freeze Notice -->
    <g transform="translate(16, 232)">
      <rect width="222" height="68" rx="6" fill="#1F1F1F" stroke="#333333"/>
      <text x="12" y="20" fill="#F2C14E" font-family="system-ui" font-size="10" font-weight="bold">❄ Holiday Freeze Aware (दसैं बिदा)</text>
      <text x="12" y="38" fill="#A3A3A3" font-family="system-ui" font-size="9">Gazetted court vacations auto-frozen.</text>
      <text x="12" y="54" fill="#FFFFFF" font-family="system-ui" font-size="9" font-weight="bold">No limitation penalty applied.</text>
    </g>
  </g>
</svg>
