<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <rect width="400" height="240" rx="10" fill="#141414" stroke="#262626"/>
  
  <!-- Step 1 Graphic: Munshi at Court Bulletin Board -->
  <rect x="20" y="20" width="160" height="200" rx="6" fill="#1A1A1A" stroke="#333333"/>
  <rect x="30" y="30" width="140" height="20" rx="3" fill="#262626"/>
  <text x="100" y="44" fill="#A3A3A3" font-family="system-ui" font-size="9" font-weight="bold" text-anchor="middle">COURT BULLETIN BOARD</text>
  
  <!-- Pinned Paper Date-Sheet -->
  <rect x="34" y="60" width="132" height="144" fill="#FFFFFF" rx="2" stroke="#CCCCCC"/>
  <circle cx="100" cy="68" r="3" fill="#E51937"/>
  <text x="100" y="84" fill="#0A0A0A" font-family="serif" font-size="9" font-weight="bold" text-anchor="middle">दैनिक पेसी सूची (Cause-List)</text>
  <line x1="44" y1="94" x2="156" y2="94" stroke="#E5E5E5"/>
  <line x1="44" y1="104" x2="156" y2="104" stroke="#E5E5E5"/>
  <line x1="44" y1="114" x2="156" y2="114" stroke="#E5E5E5"/>
  
  <!-- Highlighted Row -->
  <rect x="42" y="122" width="116" height="16" fill="#FFF8E6" stroke="#F2C14E"/>
  <text x="46" y="134" fill="#8A5800" font-family="monospace" font-size="8" font-weight="bold">#081-CP-0492 · Bench 7</text>

  <!-- Arrow -->
  <path d="M 195 120 L 225 120 M 215 112 L 225 120 L 215 128" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Phone Screen with SMS Intake -->
  <rect x="235" y="20" width="145" height="200" rx="14" fill="#0A0A0A" stroke="#FF9933" stroke-width="1.5"/>
  <rect x="280" y="26" width="55" height="4" rx="2" fill="#333333"/>
  <text x="248" y="48" fill="#FF9933" font-family="system-ui" font-size="8" font-weight="bold">08:30 AM · MUNSHI</text>
  
  <!-- Chat Bubble -->
  <rect x="244" y="58" width="127" height="90" rx="6" fill="#1F1F1F" stroke="#333333"/>
  <text x="252" y="74" fill="#2E9E5B" font-family="system-ui" font-size="8" font-weight="bold">✓ Court SMS Pasted</text>
  <text x="252" y="88" fill="#E5E5E5" font-family="system-ui" font-size="8">District Court Babar Mahal</text>
  <text x="252" y="100" fill="#E5E5E5" font-family="monospace" font-size="8">Tareekh: 2083-08-15</text>
  <text x="252" y="112" fill="#FF9933" font-family="system-ui" font-size="8">Bench 7 · Judge Sharma</text>
  <text x="252" y="136" fill="#737373" font-family="system-ui" font-size="7">Auto mapped to Shrestha case</text>

  <rect x="244" y="160" width="127" height="24" rx="4" fill="#FF9933"/>
  <text x="264" y="176" fill="#0A0A0A" font-family="system-ui" font-size="9" font-weight="bold">Assigned to Team</text>
</svg>
