<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <rect width="400" height="240" rx="10" fill="#141414" stroke="#262626"/>
  
  <!-- Smartphone Outline -->
  <g transform="translate(80, 16)">
    <rect width="240" height="208" rx="16" fill="#0A0A0A" stroke="#333333" stroke-width="2"/>
    <rect x="170" y="8" width="60" height="4" rx="2" fill="#262626"/>

    <!-- Clock Display -->
    <text x="120" y="44" fill="#FFFFFF" font-family="system-ui" font-size="28" font-weight="bold" text-anchor="middle">07:00</text>
    <text x="120" y="60" fill="#A3A3A3" font-family="system-ui" font-size="10" text-anchor="middle">मंसिर ०४ बिहीबार · Kathmandu</text>

    <!-- Push Notification Card -->
    <g transform="translate(14, 76)">
      <rect width="212" height="110" rx="10" fill="#1F1F1F" stroke="#FF9933" stroke-width="1.5"/>
      
      <!-- Juricious App Badge -->
      <rect x="12" y="10" width="16" height="16" rx="3" fill="#FF9933"/>
      <text x="20" y="22" fill="#0A0A0A" font-size="10" font-weight="bold" text-anchor="middle">J</text>
      <text x="34" y="22" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold">Juricious Chambers Alert</text>
      <text x="176" y="22" fill="#737373" font-family="system-ui" font-size="8">NOW</text>

      <!-- Alert Body -->
      <text x="12" y="44" fill="#FF9933" font-family="system-ui" font-size="10" font-weight="bold">TODAY'S HEARING: SUPREME COURT</text>
      <text x="12" y="60" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold">Shrestha v. Dept. of Internal Revenue</text>
      <text x="12" y="74" fill="#A3A3A3" font-family="system-ui" font-size="9">Bench 3 · 11:30 AM · Final Argument</text>
      <text x="12" y="88" fill="#2E9E5B" font-family="system-ui" font-size="8">Assigned: Adv. Rameshwar &amp; Junior Bikash</text>
      <rect x="146" y="76" width="54" height="20" rx="4" fill="#FF9933"/>
      <text x="156" y="90" fill="#0A0A0A" font-family="system-ui" font-size="9" font-weight="bold">Open Brief</text>
    </g>
  </g>
</svg>
